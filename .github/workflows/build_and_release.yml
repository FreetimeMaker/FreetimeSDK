name: Build and Release

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.versioncheck.outputs.version }}
      create_tag: ${{ steps.versioncheck.outputs.create_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect version & create tag
        id: versioncheck
        run: |
          # Use SDK for version detection
          # Search for version = "X.Y.Z" in SDK/build.gradle.kts
          VERSION=$(grep '^version[[:space:]]*=[[:space:]]*"' SDK/build.gradle.kts | cut -d '"' -f 2)
          echo "Found version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          git fetch --tags

          if [ -z "$VERSION" ]; then
            echo "Error: Version not found"
            exit 1
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name github-actions
            git config user.email github-actions@github.com
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.versioncheck.outputs.create_tag == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versioncheck.outputs.version }}
          draft: false
          generate_release_notes: true
